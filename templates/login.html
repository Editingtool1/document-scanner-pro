<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="auth-page"><section class="auth-card"><h1>مصحح المستمسكات</h1><p>تسجيل الدخول إلى النظام</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}<form method="post"><label>اسم المستخدم</label><input name="username" required autocomplete="username"><label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password"><button class="primary-button" style="width:100%;margin-top:16px">دخول</button></form></section></main></body></html>
